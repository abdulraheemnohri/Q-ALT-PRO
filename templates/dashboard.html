<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q-ALT PRO | Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-900 text-white min-h-screen">
    <nav class="border-b border-slate-700 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-cyan-400">Q-ALT PRO</h1>
            <div class="space-x-4">
                <a href="/" class="hover:text-cyan-400">Home</a>
                <a href="/dashboard" class="text-cyan-400">Dashboard</a>
            </div>
        </div>
    </nav>

    <main class="container mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6 mt-6">
        <!-- Control Panel -->
        <div class="lg:col-span-1 bg-slate-800 p-6 rounded-xl border border-slate-700">
            <h2 class="text-xl font-bold mb-6 flex items-center">
                <span class="w-3 h-3 bg-green-500 rounded-full mr-2"></span>
                Control Panel
            </h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Qubits</label>
                    <input type="range" id="qubitSlider" min="2" max="12" value="5" class="w-full accent-cyan-400">
                    <div class="flex justify-between text-xs text-slate-500">
                        <span>2</span>
                        <span id="qubitValue">5</span>
                        <span>12</span>
                    </div>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Algorithm</label>
                    <select id="algoSelect" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white">
                        <option value="grover">Grover Search</option>
                        <option value="annealing">Simulated Annealing</option>
                        <option value="qaoa">QAOA-Inspired</option>
                        <option value="genetic">Genetic Hybrid</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Target State (Index)</label>
                    <input type="number" id="targetIndex" value="0" class="w-full bg-slate-700 border border-slate-600 rounded p-2 text-white">
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="useAI" class="mr-2 w-4 h-4 accent-cyan-400">
                    <label for="useAI" class="text-sm text-slate-300">AI-Guided Collapse</label>
                </div>

                <button id="runBtn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 rounded-lg mt-4 transition">
                    RUN ENGINE
                </button>
            </div>
        </div>

        <!-- Visualization Area -->
        <div class="lg:col-span-3 space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-80">
                <h3 class="text-lg font-bold mb-4">Probability Distribution</h3>
                <canvas id="probChart"></canvas>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-bold mb-2">Engine Status</h3>
                    <div id="statusInfo" class="text-slate-400 text-sm">
                        Waiting for run...
                    </div>
                </div>
                <div class="bg-slate-800 p-6 rounded-xl border border-slate-700">
                    <h3 class="text-lg font-bold mb-2">Recent Logs</h3>
                    <div id="logList" class="text-slate-400 text-sm space-y-1">
                        <!-- Logs will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
